<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <!-- Axes -->
  <g stroke="#C9C6C2" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M60 20 V300 H600" />
  </g>
  <text x="330" y="328" text-anchor="middle" font-size="15" fill="#C9C6C2" opacity="0.85">Time (60 years)</text>
  <text x="26" y="160" text-anchor="middle" font-size="15" fill="#C9C6C2" opacity="0.85" transform="rotate(-90 26 160)">Intensity</text>

  <!-- Passionate love: sharp early spike, crash, then a long, low, gently wavy tail (dotted, crimson) -->
  <path
    d="M66 292
       C 70 180, 74 40, 78 30
       C 82 60, 90 150, 100 200
       C 112 240, 128 252, 150 240
       C 170 230, 185 252, 205 258
       C 230 265, 250 250, 270 258
       C 292 266, 310 250, 332 258
       C 354 266, 374 252, 396 258
       C 418 264, 438 252, 460 258
       C 482 264, 502 252, 524 258
       C 546 264, 566 254, 598 260"
    fill="none"
    stroke="#FF6FB5"
    stroke-width="3"
    stroke-linecap="round"
    stroke-dasharray="1 9"
  />
  <text x="598" y="244" text-anchor="end" font-size="14" fill="#FF6FB5">Passionate</text>

  <!-- Companionate love: slow, steady climb that levels off into a high plateau (solid, sage) -->
  <path
    d="M66 298
       C 160 292, 230 250, 280 214
       C 330 178, 380 150, 440 134
       C 480 124, 520 120, 598 118"
    fill="none"
    stroke="#3DD6ED"
    stroke-width="3"
    stroke-linecap="round"
  />
  <text x="598" y="102" text-anchor="end" font-size="14" fill="#3DD6ED">Companionate</text>
</svg>
